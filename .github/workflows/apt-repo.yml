name: Publish ViewOS APT Repository
true:
  push:
    branches:
    - master
    tags:
    - v*
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: apt-repo-publish
  cancel-in-progress: false
env:
  PAGES_BASE_URL: https://mitchell-brooke.github.io/viewos
jobs:
  build-desktop:
    name: Build viewos-desktop
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: packages/build-desktop.sh
    - name: Verify the package declares no files
      run: "deb=$(ls packages/build/viewos-desktop_*.deb)\nif dpkg-deb --contents\
        \ \"$deb\" | grep -v '^drwx' | grep -q .; then\n  echo \"::error::viewos-desktop\
        \ is a metapackage but contains files\"\n  dpkg-deb --contents \"$deb\"\n\
        \  exit 1\nfi\necho \"viewos-desktop contains no files, as expected\""
    - uses: actions/upload-artifact@v4
      with:
        name: deb-viewos-desktop
        path: packages/build/viewos-desktop_*.deb
        if-no-files-found: error
        retention-days: 30
  build-kwin-effect:
    name: Build viewos-kwin-effect
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: "export DEBIAN_FRONTEND=noninteractive\napt-get update\n# kwin-dev pulls\
        \ in the KF6 headers. Qt6's core and gui development\n# files are both in\
        \ qt6-base-dev; there is no libqt6core6t64-dev,\n# the t64 suffix applies\
        \ to the runtime library only.\n#\n# libwayland-dev is needed because KWinConfig.cmake\
        \ does\n# find_dependency(Wayland Server) even when building a plugin, and\n\
        # epoxy is required by the same file.\napt-get install --yes --no-install-recommends\
        \ \\\n  build-essential \\\n  cmake \\\n  extra-cmake-modules \\\n  pkg-config\
        \ \\\n  kwin-dev \\\n  qt6-base-dev \\\n  qt6-declarative-dev \\\n  libepoxy-dev\
        \ \\\n  libgl1-mesa-dev \\\n  binutils \\\n  fakeroot\nrm -rf /var/lib/apt/lists/*\n"
    - name: Build and package
      run: packages/build-kwin-effect.sh
    - name: Check the plugin is a loadable module
      run: "so=$(find packages/viewos-kwin-effect/usr/lib -name 'libviewosfacetilt*.so'\
        \ -print -quit)\ntest -n \"$so\"\n# KWin loads effects from usr/lib/<triplet>/kwin/effects/plugins.\n\
        case \"$so\" in\n  */kwin/effects/plugins/*) echo \"installed at $so\" ;;\n\
        \  *) echo \"::error::plugin installed at $so, which is not a path KWin scans\"\
        ; exit 1 ;;\nesac\nif readelf -d \"$so\" | grep -q '(SONAME)'; then\n  echo\
        \ \"::error::plugin has a SONAME and KWin's loader will skip it\"\n  exit\
        \ 1\nfi\n# Confirm the KPlugin metadata really is embedded. A plugin whose\n\
        # metadata.json failed to embed loads but is invisible in the\n# Desktop Effects\
        \ settings, which is very hard to diagnose later.\nstrings \"$so\" | grep\
        \ -q '\"viewosfacetilt\"' \\\n  || { echo \"::error::KPlugin metadata is not\
        \ embedded in $so\"; exit 1; }\necho \"metadata embedded\"\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-viewos-kwin-effect
        path: packages/build/viewos-kwin-effect_*.deb
        if-no-files-found: error
        retention-days: 30
  build-face-daemon:
    name: Build viewos-face-daemon
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
    - uses: actions/checkout@v4
    - name: Install build dependencies
      run: "export DEBIAN_FRONTEND=noninteractive\napt-get update\napt-get install\
        \ --yes --no-install-recommends \\\n  build-essential \\\n  cmake \\\n  pkg-config\
        \ \\\n  curl \\\n  ca-certificates \\\n  rustc \\\n  cargo \\\n  libopencv-dev\
        \ \\\n  fakeroot\nrm -rf /var/lib/apt/lists/*\n"
    - name: Report the toolchain versions
      run: 'rustc --version

        cargo --version

        pkg-config --modversion opencv4

        '
    - name: Build and package
      run: packages/build-face-daemon.sh
    - name: Run the unit tests
      run: 'export OPENCV_INCLUDE_PATHS="+/usr/include/opencv4"

        export OPENCV_LINK_PATHS="+/usr/lib/x86_64-linux-gnu"

        export OPENCV_LINK_LIBS="+,opencv_core,opencv_imgproc,opencv_imgcodecs,opencv_dnn,opencv_videoio,opencv_video,opencv_calib3d,opencv_features2d,opencv_flann"

        cargo test --manifest-path face-tilt/daemon/Cargo.toml --release

        '
    - name: Check the binary links only libraries Debian provides
      run: "# A Rust binary that statically pulled in something, or that depends\n\
        # on a library not in the package's Depends, fails at the user's desk\n# with\
        \ a version mismatch rather than anything resembling a bug\n# report.\nbin=packages/viewos-face-daemon/usr/bin/viewos-face-daemon\n\
        ldd \"$bin\" | tee /dev/stderr | grep -q 'libopencv_dnn' \\\n  || { echo \"\
        ::error::binary is not linked against OpenCV DNN\"; exit 1; }\necho \"linked\
        \ against OpenCV as expected\"\n"
    - uses: actions/upload-artifact@v4
      with:
        name: deb-viewos-face-daemon
        path: packages/build/viewos-face-daemon_*.deb
        if-no-files-found: error
        retention-days: 30
  publish:
    name: Sign and publish
    needs:
    - build-desktop
    - build-kwin-effect
    - build-face-daemon
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/download-artifact@v4
      with:
        path: debs
        pattern: deb-*
        merge-multiple: true
    - name: List what is about to be published
      run: 'ls -la debs/

        count=$(ls debs/*.deb | wc -l)

        echo "publishing $count package(s)"

        test "$count" -ge 3 || { echo "::error::expected at least 3 packages"; exit
        1; }

        '
    - name: Install reprepro
      run: 'sudo apt-get update

        sudo apt-get install --yes --no-install-recommends reprepro gnupg

        '
    - name: Import the signing key
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      run: 'echo "$GPG_PRIVATE_KEY" | gpg --batch --import

        # Trust the key fully so reprepro and gpg-agent will use it without

        # prompting. In CI this is not a trust decision: the key was put in

        # this repository''s secrets by someone who already has write access.

        KEYID=$(gpg --batch --with-colons --list-secret-keys | awk -F: ''/^fpr:/{print
        $10; exit}'')

        echo "key id: $KEYID"

        echo "${KEYID}:6:" | gpg --batch --import-ownertrust

        gpg --batch --with-colons --list-secret-keys

        '
    - name: Cache the passphrase in gpg-agent
      env:
        GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      run: '# The agent caches an unlocked passphrase for two hours, so

        # reprepro can sign the Release file, the Contents files and the

        # per-package metadata without being handed the passphrase at every

        # step. This is a CI-only convenience; see docs/building.md for how

        # the offline master key is meant to be used instead.

        echo "allow-preset-passphrase ${GPG_PASSPHRASE}" >> ~/.gnupg/gpg-agent.conf

        echo "default-cache-ttl 7200" >> ~/.gnupg/gpg-agent.conf

        gpgconf --reload gpg-agent

        # Fail here rather than midway through publishing.

        echo test | gpg --batch --sign --local-user "$(gpg --batch --with-colons --list-secret-keys
        | awk -F: ''/^fpr:/{print $10; exit}'')" >/dev/null

        echo "signing works"

        '
    - name: Build the repository
      run: "mkdir -p repo/conf\n# reprepro wants the GPG home to be usable; the runner's\
        \ is owned by\n# the invoking user already.\nexport GNUPGHOME=\"${HOME}/.gnupg\"\
        \ncp -a debs/*.deb repo/\ncd repo\nfor deb in *.deb; do\n  reprepro --export=never\
        \ includedeb trixie \"$deb\"\ndone\necho \"--- dists/trixie ---\"\nfind dists\
        \ -maxdepth 3 -type d | sort\n"
    - name: Export the public signing key
      run: 'KEYID=$(gpg --batch --with-colons --list-secret-keys | awk -F: ''/^fpr:/{print
        $10; exit}'')

        # apt wants a binary keyring, so the armored export is dearmored here

        # rather than making every user do it.

        gpg --batch --yes --export "$KEYID" > repo/signing-key.gpg

        gpg --batch --yes --armor --export "$KEYID" > repo/signing-key.asc

        test -s repo/signing-key.gpg || { echo "::error::empty key export"; exit 1;
        }

        ls -la repo/signing-key.*

        '
    - name: Verify the repository is self-consistent
      run: "export GNUPGHOME=\"${HOME}/.gnupg\"\ncd repo\n# Recompute the whole index\
        \ and compare. A repository that cannot\n# survive its own export is broken\
        \ in a way users hit as\n# \"Hash Sum mismatch\" days later.\nreprepro export\n\
        if [ -n \"$(find dists -name 'InRelease' -o -name 'Release.gpg')\" ]; then\n\
        \  echo \"Release is signed\"\nelse\n  echo \"::error::no signed Release file\
        \ was produced\"\n  exit 1\nfi\ntest -f dists/trixie/main/binary-amd64/Packages.gz\
        \ \\\n  || { echo \"::error::no Packages index\"; exit 1; }\nzcat dists/trixie/main/binary-amd64/Packages.gz\
        \ | grep -c '^Package: '\n"
    - name: Publish to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./repo
        publish_branch: gh-pages
        force_orphan: true
        user_name: github-actions[bot]
        user_email: github-actions[bot]@users.noreply.github.com
        commit_message: Publish ViewOS APT repository
    - name: Record the published URL
      run: 'echo "### APT repository published" >> "$GITHUB_STEP_SUMMARY"

        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo "Base URL: \`${PAGES_BASE_URL}\`" >> "$GITHUB_STEP_SUMMARY"

        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo ''To use it on a ViewOS or Debian system:'' >> "$GITHUB_STEP_SUMMARY"

        echo "" >> "$GITHUB_STEP_SUMMARY"

        echo ''```sh'' >> "$GITHUB_STEP_SUMMARY"

        echo "curl -fsSL ${PAGES_BASE_URL}/signing-key.gpg | sudo tee /usr/share/keyrings/viewos-archive-keyring.gpg
        >/dev/null" >> "$GITHUB_STEP_SUMMARY"

        echo "echo ''deb [signed-by=/usr/share/keyrings/viewos-archive-keyring.gpg]
        ${PAGES_BASE_URL} trixie main'' | sudo tee /etc/apt/sources.list.d/viewos.list"
        >> "$GITHUB_STEP_SUMMARY"

        echo "sudo apt update" >> "$GITHUB_STEP_SUMMARY"

        echo ''```'' >> "$GITHUB_STEP_SUMMARY"

        '
