[package]
name = "viewos-face-daemon"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ViewOS face tracking daemon for head-tracked window perspective"
repository = "https://github.com/jmultimate/viewos"

[dependencies]
# Video capture
v4l = "0.9"

# Image processing
image = "0.24"
imageproc = "0.24"

# OpenCV bindings for YuNet
opencv = { version = "0.21", features = ["opencv-4"] }

# Async runtime
tokio = { version = "1.38", features = ["full"] }

# Serialization for socket communication
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Configuration
config = "0.13"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# System integration
nix = "0.27"
dbus = { version = "0.9", features = ["tokio1"] }

# Math
nalgebra = "0.32"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true