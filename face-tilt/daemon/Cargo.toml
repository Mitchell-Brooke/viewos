[package]
name = "viewos-face-daemon"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "GPL-3.0-or-later"
description = "ViewOS face tracking daemon for head-tracked window perspective"
repository = "https://github.com/Mitchell-Brooke/viewos"
readme = "README.md"
publish = false

[[bin]]
name = "viewos-face-daemon"
path = "src/main.rs"

[lib]
name = "viewos_face_daemon"
path = "src/lib.rs"

[dependencies]
# OpenCV bindings for the YuNet detector, PnP pose solver and webcam capture.
#
# Pinned to 0.98.2 because Trixie ships rustc 1.85.1 and opencv 0.99+
# requires rustc 1.88.0. 0.98.2 works with rustc >= 1.82.0 and supports
# all the features we use (dnn, videoio, calib3d).
#
# default-features = false is deliberate: the default feature set pulls in
# every OpenCV module, including the CUDA ones, which we neither need nor can
# link against on a machine without the NVIDIA toolkit. The features listed
# here are the transitive minimum for dnn + videoio + calib3d.
opencv = { version = "0.98.2", default-features = false, features = [
    "dnn",
    "videoio",
    "calib3d",
] }

tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "signal",
    "macros",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

anyhow = "1"
clap = { version = "4", features = ["derive"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
# Keep debug info: dpkg-deb-strip strips it into a separate -dbgsym package,
# which Debian policy expects for anything with compiled code. Stripping it
# here instead would make backtraces from user bug reports useless.
strip = "debuginfo"
debug = 1
panic = "abort"
