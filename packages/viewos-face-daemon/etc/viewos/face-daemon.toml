# ViewOS Face Tracking Daemon Configuration
# This file is installed to /etc/viewos/face-daemon.toml
# Edit with your physical screen dimensions and camera position

[detector]
# Model path (MIT licensed YuNet from OpenCV Zoo)
model_path = "/usr/share/viewos/models/face_detection_yunet_2023mar.onnx"

# Input resolution for the model (YuNet supports 320x320 or 640x640)
input_width = 320
input_height = 320

# Detection thresholds
confidence_threshold = 0.9
nms_threshold = 0.3
top_k = 5000

# OpenCV DNN backend/target
# Backend: 0=OpenCV, 1=CUDA, 2=OpenCL, 3=VKCOM
# Target: 0=CPU, 1=OpenCL, 2=OPENCL_FP16, 3=MYRIAD, 4=VULKAN, 5=CUDA, 6=CUDA_FP16
backend = 0
target = 0

[pose]
# Physical screen dimensions (mm) - MEASURE YOUR SCREEN!
# Run the calibration wizard or measure manually:
# Width = horizontal viewable area in millimeters
# Height = vertical viewable area in millimeters
screen_width_mm = 530.0
screen_height_mm = 300.0

# Camera position relative to screen center (mm)
# Positive X = right of center, Positive Y = above center, Positive Z = toward user
camera_offset_x_mm = 0.0
camera_offset_y_mm = -50.0   # Camera typically above screen center
camera_offset_z_mm = 0.0

# Camera focal length (mm) - typical webcam ~3.6mm
# Check your webcam specs or leave default
focal_length_mm = 3.6

[tilt]
# Maximum tilt angle in degrees
max_angle_deg = 12.0

# Deadzone in degrees - no tilt within this range
deadzone_deg = 2.0

# Smoothing factor (0.0-1.0, lower = smoother but more lag)
smoothing_factor = 0.15

# Invert axes if needed
invert_yaw = false
invert_pitch = true

[daemon]
# Maximum FPS for publishing tilt data
max_fps = 20

# Unix socket path
socket_path = "/run/viewos/face-tilt.sock"

# Log level: trace, debug, info, warn, error
log_level = "info"