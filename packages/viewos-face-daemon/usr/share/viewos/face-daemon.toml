# Default configuration for viewos-face-daemon.
#
# Do not edit this file: it is replaced on package upgrade. To change a
# setting, copy this file to
#
#     ~/.config/viewos/face-daemon.toml
#
# and edit that copy. The user's file takes precedence over this one, key by
# key within each table.
#
# Every key below is shown with its default value, so this file doubles as
# documentation. See docs/face-tilt.md for what the values mean in practice.

[daemon]
# How often head positions are published, in hertz.
#
# The KWin effect has to repaint the whole screen whenever a position arrives,
# so this is a direct power cost. 20 is smooth enough to read a window without
# the window appearing to breathe. Lower it on a laptop.
max_fps = 20

# Where to publish. Leave empty to use $XDG_RUNTIME_DIR/viewos/face-tilt.sock,
# which is what the packaged systemd user unit expects, and which is removed
# automatically when you log out. Do not point this at a shared location.
socket_path = ""

# Permissions on the socket, as octal digits. 0600 means only you may connect.
# Do not loosen this: head position is private, and a world-readable socket
# lets any local process watch where you are sitting.
socket_mode = "0600"

# Which camera to open. 0 is normally the built-in webcam.
camera_index = 0

# Requested capture resolution. Cameras that cannot supply this deliver their
# own fixed mode instead; the daemon reports what it actually got at startup.
capture_width = 640
capture_height = 480
capture_fps = 30

# How many consecutive frames without a face to tolerate before reporting loss.
# At 30 fps capture, 5 is about 160 ms, so a blink does not reset the effect.
lost_frame_tolerance = 5

[detector]
# Path to the YuNet model, installed by the viewos-face-daemon package.
model_path = "/usr/share/viewos/models/face_detection_yunet_2023mar.onnx"

# Horizontal field of view of the camera, in degrees.
#
# This is the one value that must be right for the head position to be
# accurate, and it is the one webcams do not report. It sets the focal length
# used to turn pixel positions into distances.
#
#   about 60   laptop webcams, and most external webcams
#   about 90   1080p streaming webcams
#   about 120  wide-angle USB cameras; without this they report the head as
#              being much further away than it is
#
# If face tilt feels like it is working but the windows respond as though you
# are further away than you really are, this value is too small.
horizontal_fov_deg = 60.0

# Aspect ratio the camera is expected to deliver, used only as a startup
# warning if the capture mode was not applied.
expected_aspect = 1.3333333

# Discard detections below this confidence. Higher means fewer false positives
# and more missed faces in poor light. 0.85 suits most webcams.
confidence_threshold = 0.85

# Upper bound on candidate anchors read from the network output. Lower values
# make detection slightly faster; there is no reason to raise this.
max_candidates = 5000

[geometry]
# Where the camera sits relative to the centre of the screen, in millimetres.
#
# Axes: +X right, +Y up, +Z towards the viewer. A laptop with the camera above
# the screen is roughly y = +80, z = -200. A monitor-top webcam reaches further,
# so z is more negative.
#
# This affects the reported head *position* on the screen, and therefore how
# far windows rotate. A wrong value here shows up as windows tilting the wrong
# amount vertically.
camera_offset_mm = [0.0, 80.0, -200.0]

# Assumed distance from the camera to your head, in millimetres. Also the
# value published before the first successful detection.
#
# This is a distance to the head, not to the screen, so for a laptop at a
# normal viewing distance about 600 is right. Larger for a desktop monitor.
nominal_viewing_distance_mm = 600.0

# Reject a pose that implies a viewing distance further away than this. This
# catches the occasional nonsense result from a blurred or steeply angled face,
# which would otherwise spin the windows for a frame.
max_viewing_distance_mm = 1200.0

# How far from the centre of the screen the head is allowed to be reported,
# as a fraction of the screen. Head positions outside this are clamped to the
# edge rather than discarded, so a partly-detected face still produces a
# plausible position instead of nothing.
head_search_margin = 0.25
